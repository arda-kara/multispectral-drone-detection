[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True

# Ignore missing imports for external libraries that don't have stubs
[mypy-torch.*]
ignore_missing_imports = True

[mypy-torchvision.*]
ignore_missing_imports = True

[mypy-torch.nn.*]
ignore_missing_imports = True

[mypy-torch.utils.*]
ignore_missing_imports = True

[mypy-detectron2.*]
ignore_missing_imports = True

[mypy-detectron2.engine.*]
ignore_missing_imports = True

[mypy-detectron2.config.*]
ignore_missing_imports = True

[mypy-detectron2.data.*]
ignore_missing_imports = True

[mypy-detectron2.data.datasets.*]
ignore_missing_imports = True

[mypy-detectron2.utils.*]
ignore_missing_imports = True

[mypy-detectron2.utils.logger.*]
ignore_missing_imports = True

[mypy-detectron2.utils.visualizer.*]
ignore_missing_imports = True

[mypy-detectron2.modeling.*]
ignore_missing_imports = True

[mypy-detectron2.evaluation.*]
ignore_missing_imports = True

[mypy-ultralytics.*]
ignore_missing_imports = True

[mypy-roboflow.*]
ignore_missing_imports = True

[mypy-wandb.*]
ignore_missing_imports = True

[mypy-albumentations.*]
ignore_missing_imports = True

[mypy-cv2.*]
ignore_missing_imports = True

[mypy-PIL.*]
ignore_missing_imports = True

[mypy-PIL.Image.*]
ignore_missing_imports = True
