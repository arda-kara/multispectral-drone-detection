# Multi-stream inference configuration
rgb_model:  runs/detect/rgb/yolov8n.pt
lwir_model: runs/detect/lwir/yolov8n_960px/weights/best.pt
uv_model:   runs/detect/uv/yolov8n_800px/weights/best.pt

rgb_source:  stream_data/rgb_synced.mp4
lwir_source: stream_data/lwir_synced.mp4
uv_source:   stream_data/uv_synced.mp4

lwir_homography: homography/H_lwir_to_rgb.npy
uv_homography:   homography/H_uv_to_rgb.npy
lwir_homography_offset: [0.0, 0.0]
uv_homography_offset:   [20.0, 0.0]  # increase x to move UV boxes right on RGB

output: runs/inference/output.mp4

render_mode: grid    # solo | debug | sbs | fused_on_rgb | grid
max_frames: null     # null to run until a stream ends

fusion_method: spatial  # spatial | wbf | bayesian
fusion_streams: [rgb, lwir, uv]  # choose which available streams participate in fusion
center_dist_px: 60.0    # center-distance clustering threshold in RGB pixels
fusion_margin: 0.10     # expand fused boxes to absorb small alignment errors
iou_thr:  0.35          # used by wbf / bayesian only
skip_thr: 0.01
conf_thr:   0.25   # post-fusion gate
model_conf: 0.25   # YOLO NMS threshold

imgsz:  960
device: mps
show:   true
display_scale: 0.4   # scales the live window only — saved video is always full resolution

# LWIR enhancement (no retraining required)
lwir_clahe:      true   # apply CLAHE to boost low-contrast thermal targets
lwir_clahe_clip: 2.0    # CLAHE clip limit — higher = stronger contrast
lwir_augment:    false  # YOLO TTA (augment=True) — slower but higher recall
lwir_model_conf: 0.15   # separate NMS threshold for the LWIR model

# LWIR Kalman tracker
lwir_tracker:        true  # enable frame-to-frame Kalman tracking
lwir_trk_max_age:    3     # fill gaps for up to N consecutive missed frames
lwir_trk_min_hits:   2     # confirm a track after N consecutive detections
lwir_trk_iou_thr:    0.25  # IoU threshold for detection-to-track association
lwir_trk_conf_decay: 0.8   # confidence multiplier per fill-in frame
